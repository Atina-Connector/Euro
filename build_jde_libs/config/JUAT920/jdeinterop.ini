;=======================================================================
; jdeinterop.ini - JDE Interop/Connector configuration for order-validator
; Target Enterprise Server: 192.168.252.158 (192.168.252.158) — UAT JUAT920
;=======================================================================

[SERVER]
glossaryTextServer=192.168.252.158:6017
codePage=1252

[JDENET]
serviceNameConnect=6017
enterpriseServerTimeout=180000
maxPoolSize=30

#==========================================================
# Cache feature for Connector
#==========================================================
[CACHE]
UserSession=18000000
SpecExpire=300000000

#==========================================================
# Inbound Business Function call
#==========================================================
[INTEROP]
enterpriseServer=192.168.252.158
port=6017
manual_timeout=30000000
Repository=config/repository

#==========================================================
# Security Server.
# Despite the "Proxy" name, SecurityServerProxyImpl uses JdeNet binary protocol
# on the JDENET port (6017), not HTTP. So SecurityServer must point to the
# Enterprise Server (E1DDB01), not the JAS.
#==========================================================
[SECURITY]
NumServers=1
SecurityServer=192.168.252.158

#==========================================================
# OCM
#==========================================================
[OCM]
OCMEnabled=true

[TRANSACTIONS]
ReapInterval=5
MaxAge=10
