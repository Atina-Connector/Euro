[JDBj-CONNECTION POOL]
cachePurgeSize=5
cleanPoolInterval=300000
connectionTimeout=1800000
enableFastConnectionFailoverInOracleDBConnectionPool=false
enableOracleDBConnectionPoolTrace=false
initialConnection=5
maxConnection=200
maxSize=50
minConnection=0
oracleDBConnectionPoolFactoryClassName=oracle.jdbc.replay.OracleDataSourceImpl
poolGrowth=5
useConnectionStackTrace=false
useOracleDBConnectionPool=false

[JDBj-JDBC DRIVERS]
AS400=com.ibm.as400.access.AS400JDBCDriver
#ORACLE=oracle.jdbc.driver.OracleDriver
#SQLSERVER=com.microsoft.sqlserver.jdbc.SQLServerDriver
#UDB=COM.ibm.db2.jdbc.app.DB2Driver

[JDBj-LOGS]
jdbcTrace=false
sqlValDeLimiter=
sqlValInLine=false
sqlValQuoteChar='

[JDBj-RUNTIME PROPERTIES]
AS400DatabaseASP=
as400ExtendedDynamic=true
as400NativeJDBCDriver=true
as400Package=JDBj
as400PackageLibrary=
autoDetectPackage=true
dataCacheEntrySizeThreshold=500
dataCacheEntryThreshold=100
e1MenuCachePurge=600000
enableDataPrivacySkipRecord=false
forceSingleDataSource=false
msSQLQueryAttempts=3
msSQLQueryTimeout=10000
noWhereParen=false
ocmCachePurge=600000
parallelAppGens=10
personalSpecVersions=false
resultSetTimeout=60000
retryInterval=0
retryMaximum=5
securityCachePurge=600000
serviceCachePurge=600000
specCachePurge=600000
specConsistencyCheck=minimal
statementFetchSize=0
timedOutResultSetPurgeCounter=100
transactionIsolation=default
transactionTimeout=120000
triggerAutoFetch=none
updateableResultSetTimeout=-1
usageExecutionThreshold=5000
usageFetchSizeThreshold=500
usageResultSetOpenThreshold=60000
usageTracking=false
usageTrackingOutput=log
usageTransactionActiveThreshold=120000
usageUnusedFetchedFields=false
useTcpNoDelayForAS400JDBC=false
useTcpNoDelayForOracleJDBC=false
useTLS=false

[JDBj-SERVER]
dbcsConversionTolerant=true

